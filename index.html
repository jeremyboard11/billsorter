<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dispatch Grid Sorter</title>
  <!-- Tailwind CSS for UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS to read XLSX and CSV files -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- ZXing Barcode Scanner Library -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 text-center">
    <h1 class="text-xl font-bold tracking-wide text-blue-400">Dispatch Grid Sorter</h1>
    <p id="status-badge" class="text-xs text-slate-400 mt-1">Step 1: Upload Data Files</p>
  </header>

  <!-- Main Container -->
  <main class="flex-1 flex flex-col p-4 max-w-xl mx-auto w-full gap-4">

    <!-- STEP 1: FILE UPLOAD SECTION -->
    <div id="setup-files-card" class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg space-y-4">
      <h2 class="text-md font-semibold text-slate-200 border-b border-slate-700 pb-2">1. Load Dispatch Files</h2>
      
      <div>
        <label class="block text-xs text-slate-400 mb-1">Distribution Orders (.csv)</label>
        <input type="file" id="dist-file" accept=".csv" class="w-full text-sm text-slate-300 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white file:font-semibold hover:file:bg-blue-500 cursor-pointer bg-slate-900 rounded-lg border border-slate-700">
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">Trip Listing (.xlsx / .csv)</label>
        <input type="file" id="trip-file" accept=".xlsx, .xls, .csv" class="w-full text-sm text-slate-300 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white file:font-semibold hover:file:bg-blue-500 cursor-pointer bg-slate-900 rounded-lg border border-slate-700">
      </div>

      <button id="process-files-btn" onclick="processFiles()" class="w-full py-3 bg-emerald-600 text-white font-bold rounded-lg shadow hover:bg-emerald-500 disabled:opacity-50 disabled:cursor-not-allowed">
        Build Lookup Index
      </button>
    </div>

    <!-- STEP 2 & 3: SCANNING INTERFACE -->
    <div id="scanner-section" class="hidden flex-1 flex flex-col gap-4">

      <!-- Scanner Input Device Toggle -->
      <div class="bg-slate-800 rounded-xl p-3 border border-slate-700 flex flex-col gap-2">
        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Scanner Device Source</label>
        <div class="grid grid-cols-2 gap-2 bg-slate-900 p-1 rounded-lg border border-slate-700">
          <button id="input-camera-btn" onclick="setScanInputMethod('CAMERA')" class="py-2 text-xs font-bold rounded-md bg-blue-600 text-white transition-colors">
            📷 Phone Camera
          </button>
          <button id="input-hardware-btn" onclick="setScanInputMethod('HARDWARE')" class="py-2 text-xs font-bold rounded-md text-slate-400 hover:text-white transition-colors">
            🔌 Bluetooth / USB
          </button>
        </div>
      </div>
      
      <!-- Operation Mode Toggle Header -->
      <div class="flex bg-slate-800 rounded-lg p-1 border border-slate-700">
        <button id="mode-grid-btn" onclick="setMode('GRID')" class="flex-1 py-2 text-sm font-bold rounded-md bg-blue-600 text-white shadow">
          1. Map Table Grid
        </button>
        <button id="mode-sort-btn" onclick="setMode('SORT')" class="flex-1 py-2 text-sm font-bold rounded-md text-slate-400 hover:text-white">
          2. Scan & Sort Bills
        </button>
      </div>

      <!-- Live Video Viewfinder (Shown in Camera mode) -->
      <div id="camera-viewfinder" class="relative bg-black rounded-xl overflow-hidden aspect-video border-2 border-slate-700 shadow-inner transition-colors duration-150">
        <video id="video-feed" class="w-full h-full object-cover"></video>
        <div class="absolute inset-0 border-2 border-dashed border-blue-400/50 pointer-events-none flex items-center justify-center">
          <span class="text-xs text-blue-200/70 bg-black/50 px-2 py-1 rounded">Align Barcode Here</span>
        </div>
      </div>

      <!-- Hardware Scanner Status Banner (Shown in Bluetooth/USB mode) -->
      <div id="hardware-viewfinder" class="hidden relative bg-slate-800 rounded-xl p-6 border-2 border-emerald-500/50 text-center flex flex-col items-center justify-center gap-2 shadow-inner">
        <span class="text-3xl">📡</span>
        <span class="text-sm font-bold text-emerald-400">Bluetooth Scanner Ready</span>
        <span class="text-xs text-slate-400">Scan barcodes directly using your paired hardware scanner.</span>
        <!-- Hidden input field to catch scanner HID keyboard input -->
        <input type="text" id="hardware-scanner-input" class="opacity-0 absolute inset-0 w-full h-full cursor-pointer" autocomplete="off" autofocus />
      </div>

      <!-- GRID SETUP MODE CONTROLS -->
      <div id="grid-controls" class="bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-3">
        <div class="flex justify-between items-center border-b border-slate-700 pb-2">
          <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Target Cell:</label>
          <div class="flex items-center gap-2">
            <input type="text" id="target-cell" value="A1" onchange="this.value = this.value.toUpperCase(); updateMappedGridUI();" class="uppercase text-center font-mono font-bold text-md bg-slate-900 border border-blue-500 rounded px-2 py-1 w-16 text-blue-400 focus:outline-none">
            <button type="button" onclick="advanceToNextRow()" class="bg-slate-700 hover:bg-slate-600 text-blue-300 font-semibold text-xs py-1 px-2 rounded border border-slate-600 transition-colors">
              Next Row ➔
            </button>
          </div>
        </div>

        <!-- VISUAL INTERACTIVE GRID -->
        <div class="space-y-1">
          <span class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Table Layout Preview (Tap cell to select)</span>
          <div id="grid-matrix-container" class="overflow-x-auto bg-slate-900 p-3 rounded-lg border border-slate-800 max-h-64 overflow-y-auto space-y-2">
            <!-- Dynamic Grid Matrix Renders Here -->
          </div>
        </div>
      </div>

      <!-- SORTING DISPLAY RESULT (BIG TEXT OUTPUT) -->
      <div id="sort-controls" class="hidden flex-1 flex flex-col justify-center items-center bg-slate-800 border border-slate-700 rounded-xl p-6 text-center space-y-2">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Destination Cell</span>
        <div id="result-cell-display" class="text-7xl font-black text-emerald-400 tracking-tight py-2">
          --
        </div>
        <div id="result-meta-display" class="text-sm text-slate-300 font-mono">
          Scan a bill cover sheet ASN
        </div>
      </div>

    </div>

  </main>

  <script>
    // State management
    let lookupMap = new Map();     // Key: ASN (stripped) -> Value: Trip ID
    let gridMap = new Map();       // Key: Trip ID -> Value: Cell Name (e.g. A1)
    let currentMode = 'GRID';      // 'GRID' or 'SORT'
    let scanInputMethod = 'CAMERA';// 'CAMERA' or 'HARDWARE'
    let codeReader = null;
    let isProcessingScan = false;

    // Audio Feedback
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 880, type = 'sine') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.15);
    }

    // Camera Scan Visual Flash Feedback
    function triggerScanFlash() {
      const cameraView = document.getElementById('camera-viewfinder');
      cameraView.classList.remove('border-slate-700');
      cameraView.classList.add('border-rose-500', 'shadow-lg', 'shadow-rose-500/50');
      
      setTimeout(() => {
        cameraView.classList.remove('border-rose-500', 'shadow-lg', 'shadow-rose-500/50');
        cameraView.classList.add('border-slate-700');
      }, 300);
    }

    // Step 1: Parse Files & Build Lookup Map
    async function processFiles() {
      const distFileInput = document.getElementById('dist-file').files[0];
      const tripFileInput = document.getElementById('trip-file').files[0];

      if (!distFileInput || !tripFileInput) {
        alert("Please select both Distribution Orders.csv and Trip Listing.xlsx files.");
        return;
      }

      document.getElementById('status-badge').innerText = "Processing Files...";

      try {
        const distData = await readSpreadsheet(distFileInput);
        const tripData = await readSpreadsheet(tripFileInput);

        // Map Trip Listing: Route Num -> Trip ID
        const routeToTripMap = new Map();
        tripData.forEach(row => {
          const routeNum = String(row['Route Num'] || row['Route'] || '').trim();
          const tripId = String(row['Trip ID'] || row['Trip'] || '').trim();
          if (routeNum && tripId) {
            routeToTripMap.set(routeNum, tripId);
          }
        });

        // Map Distribution Orders: Stripped ASN -> Trip ID
        lookupMap.clear();
        let matchCount = 0;

        distData.forEach(row => {
          let distOrder = String(row['Distribution Order'] || '').trim();
          const refShipment = String(row['Reference Shipment Number'] || '').trim();

          if (distOrder && refShipment) {
            if (distOrder.toUpperCase().startsWith('C')) {
              distOrder = distOrder.substring(1);
            }

            if (routeToTripMap.has(refShipment)) {
              const tripId = routeToTripMap.get(refShipment);
              lookupMap.set(distOrder, tripId);
              matchCount++;
            }
          }
        });

        document.getElementById('setup-files-card').classList.add('hidden');
        document.getElementById('scanner-section').classList.remove('hidden');
        document.getElementById('status-badge').innerText = `Ready! Indexed ${matchCount} ASNs.`;
        
        setupHardwareScannerListener();
        setScanInputMethod('CAMERA');
        updateMappedGridUI();

      } catch (err) {
        alert("Error parsing files: " + err.message);
        document.getElementById('status-badge').innerText = "Error loading files.";
      }
    }

    // SheetJS file reader helper
    function readSpreadsheet(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(firstSheet, { defval: "" });
            resolve(json);
          } catch (err) {
            reject(err);
          }
        };
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
      });
    }

    // Switch between Camera and Bluetooth Scanner input devices
    function setScanInputMethod(method) {
      scanInputMethod = method;
      const cameraBtn = document.getElementById('input-camera-btn');
      const hardwareBtn = document.getElementById('input-hardware-btn');
      const cameraView = document.getElementById('camera-viewfinder');
      const hardwareView = document.getElementById('hardware-viewfinder');

      if (method === 'CAMERA') {
        cameraBtn.className = "py-2 text-xs font-bold rounded-md bg-blue-600 text-white transition-colors shadow";
        hardwareBtn.className = "py-2 text-xs font-bold rounded-md text-slate-400 hover:text-white transition-colors";
        cameraView.classList.remove('hidden');
        hardwareView.classList.add('hidden');
        
        startCameraScanner();
      } else {
        hardwareBtn.className = "py-2 text-xs font-bold rounded-md bg-emerald-600 text-white transition-colors shadow";
        cameraBtn.className = "py-2 text-xs font-bold rounded-md text-slate-400 hover:text-white transition-colors";
        hardwareView.classList.remove('hidden');
        cameraView.classList.add('hidden');

        stopCameraScanner();
        focusHardwareScannerInput();
      }
    }

    // Camera Scanner Controller set to 10 FPS
    function startCameraScanner() {
      if (!codeReader) {
        codeReader = new ZXing.BrowserMultiFormatReader();
      } else {
        codeReader.reset();
      }

      const constraints = {
        video: {
          facingMode: { ideal: "environment" },
          frameRate: { max: 10, ideal: 10 },
          width: { ideal: 640, max: 1280 },
          height: { ideal: 480, max: 720 },
          focusMode: { ideal: "continuous" }
        }
      };

      codeReader.decodeFromConstraints(constraints, 'video-feed', (result, err) => {
        if (result && !isProcessingScan) {
          isProcessingScan = true;
          triggerScanFlash();
          handleScannedBarcode(result.text.trim());
          setTimeout(() => { isProcessingScan = false; }, 800);
        }
      });
    }

    function stopCameraScanner() {
      if (codeReader) {
        codeReader.reset();
      }
    }

    // Bluetooth / USB Scanner Keypress Listener
    function setupHardwareScannerListener() {
      const hwInput = document.getElementById('hardware-scanner-input');
      
      hwInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const scannedText = hwInput.value.trim();
          if (scannedText) {
            handleScannedBarcode(scannedText);
            hwInput.value = '';
          }
        }
      });

      // Keep focus on hidden input unless editing target cell
      document.addEventListener('click', (e) => {
        if (scanInputMethod === 'HARDWARE' && e.target.id !== 'target-cell') {
          focusHardwareScannerInput();
        }
      });
    }

    function focusHardwareScannerInput() {
      const hwInput = document.getElementById('hardware-scanner-input');
      if (hwInput && scanInputMethod === 'HARDWARE') {
        hwInput.focus();
      }
    }

    // Switch between Mapping Grid and Sorting Bills
    function setMode(mode) {
      currentMode = mode;
      const gridBtn = document.getElementById('mode-grid-btn');
      const sortBtn = document.getElementById('mode-sort-btn');
      const gridControls = document.getElementById('grid-controls');
      const sortControls = document.getElementById('sort-controls');

      if (mode === 'GRID') {
        gridBtn.className = "flex-1 py-2 text-sm font-bold rounded-md bg-blue-600 text-white shadow";
        sortBtn.className = "flex-1 py-2 text-sm font-bold rounded-md text-slate-400 hover:text-white";
        gridControls.classList.remove('hidden');
        sortControls.classList.add('hidden');
      } else {
        sortBtn.className = "flex-1 py-2 text-sm font-bold rounded-md bg-emerald-600 text-white shadow";
        gridBtn.className = "flex-1 py-2 text-sm font-bold rounded-md text-slate-400 hover:text-white";
        sortControls.classList.remove('hidden');
        gridControls.classList.add('hidden');
      }

      if (scanInputMethod === 'HARDWARE') {
        focusHardwareScannerInput();
      }
    }

    // Step 3: Handle Scanned Barcode Logic
    function handleScannedBarcode(scannedText) {
      if (currentMode === 'GRID') {
        // Mapping Mode: scanned text is Trip ID on paper sheet
        const targetCellInput = document.getElementById('target-cell');
        const cellName = targetCellInput.value.toUpperCase().trim();

        if (!cellName) {
          alert("Please specify a grid cell (e.g. A1).");
          return;
        }

        // Unmap existing cell if Trip ID was previously placed elsewhere
        for (let [tId, cell] of gridMap.entries()) {
          if (cell === cellName || tId === scannedText) {
            gridMap.delete(tId);
          }
        }

        gridMap.set(scannedText, cellName);
        playBeep(880);

        // Auto-advance to next column cell on map
        targetCellInput.value = getNextGridColumn(cellName);
        updateMappedGridUI();

      } else {
        // Sorting Mode: scanned text is ASN bill barcode
        let asn = scannedText;
        if (asn.toUpperCase().startsWith('C')) {
          asn = asn.substring(1);
        }

        const displayCell = document.getElementById('result-cell-display');
        const displayMeta = document.getElementById('result-meta-display');

        if (lookupMap.has(asn)) {
          const tripId = lookupMap.get(asn);
          
          if (gridMap.has(tripId)) {
            const cell = gridMap.get(tripId);
            displayCell.innerText = cell;
            displayCell.className = "text-7xl font-black text-emerald-400 tracking-tight py-2";
            displayMeta.innerText = `ASN: ${asn} ➔ Trip ID: ${tripId}`;
            playBeep(1046);
          } else {
            displayCell.innerText = "NO CELL";
            displayCell.className = "text-5xl font-black text-amber-400 tracking-tight py-2";
            displayMeta.innerText = `Trip ID ${tripId} not mapped on table grid!`;
            playBeep(300, 'sawtooth');
          }
        } else {
          displayCell.innerText = "NOT FOUND";
          displayCell.className = "text-5xl font-black text-rose-500 tracking-tight py-2";
          displayMeta.innerText = `ASN ${asn} not found in Distribution Orders`;
          playBeep(200, 'square');
        }
      }
    }

    // Target a specific cell manually via click
    function selectTargetCell(cellName) {
      document.getElementById('target-cell').value = cellName;
      updateMappedGridUI();
      if (scanInputMethod === 'HARDWARE') {
        focusHardwareScannerInput();
      }
    }

    // Render Visual Matrix with active trips + dynamic blank expansion cells
    function updateMappedGridUI() {
      const container = document.getElementById('grid-matrix-container');
      const activeTargetCell = document.getElementById('target-cell').value.toUpperCase().trim();

      // Structure grid data by Row Letter and Col Number
      const rowMap = new Map(); // Letter -> Map(ColNumber -> TripID)
      let maxLetter = 'A';

      // Load mapped cells into structured data
      for (let [tripId, cell] of gridMap.entries()) {
        const match = cell.match(/^([A-Z]+)(\d+)$/);
        if (match) {
          const letter = match[1];
          const col = parseInt(match[2], 10);
          
          if (!rowMap.has(letter)) rowMap.set(letter, new Map());
          rowMap.get(letter).set(col, tripId);

          if (letter.localeCompare(maxLetter) > 0) maxLetter = letter;
        }
      }

      // Ensure current target cell row is included in matrix render
      const currentMatch = activeTargetCell.match(/^([A-Z]+)(\d+)$/);
      if (currentMatch) {
        const curLetter = currentMatch[1];
        if (!rowMap.has(curLetter)) rowMap.set(curLetter, new Map());
        if (curLetter.localeCompare(maxLetter) > 0) maxLetter = curLetter;
      } else if (!rowMap.has('A')) {
        rowMap.set('A', new Map());
      }

      // Sort row keys alphabetically
      const sortedRowKeys = Array.from(rowMap.keys()).sort((a, b) => 
        a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' })
      );

      let html = '';

      sortedRowKeys.forEach(letter => {
        const cols = rowMap.get(letter);
        const maxCol = cols.size > 0 ? Math.max(...Array.from(cols.keys())) : 0;
        
        html += `<div class="flex items-center gap-1.5 overflow-x-auto pb-1">`;
        html += `<div class="w-6 font-bold text-xs text-slate-500 shrink-0 text-center">${letter}</div>`;

        // Render filled and blank column cells for this row
        const limitCol = maxCol + 1; // Include next blank column
        for (let c = 1; c <= limitCol; c++) {
          const cellName = `${letter}${c}`;
          const tripId = cols.get(c);
          const isSelected = (cellName === activeTargetCell);

          if (tripId) {
            // Mapped Cell
            html += `
              <button type="button" onclick="selectTargetCell('${cellName}')" 
                class="shrink-0 flex flex-col items-center justify-center w-16 h-14 rounded-lg border text-left p-1 transition-all ${
                  isSelected 
                    ? 'bg-blue-600/30 border-blue-400 ring-2 ring-blue-400 text-white' 
                    : 'bg-slate-800 border-slate-700 hover:border-slate-500 text-slate-200'
                }">
                <span class="text-[10px] font-bold ${isSelected ? 'text-blue-300' : 'text-slate-400'}">${cellName}</span>
                <span class="text-xs font-mono font-black truncate w-full text-center">${tripId}</span>
              </button>`;
          } else {
            // Blank Extension Cell
            html += `
              <button type="button" onclick="selectTargetCell('${cellName}')" 
                class="shrink-0 flex flex-col items-center justify-center w-16 h-14 rounded-lg border border-dashed transition-all ${
                  isSelected 
                    ? 'bg-blue-600/20 border-blue-400 ring-2 ring-blue-400 text-blue-300' 
                    : 'border-slate-700 hover:border-slate-500 text-slate-500 hover:text-slate-300'
                }">
                <span class="text-[10px] font-bold">${cellName}</span>
                <span class="text-xs font-bold">+</span>
              </button>`;
          }
        }
        html += `</div>`;
      });

      // Next Row Placeholder Button at the bottom
      const nextRowLetter = getNextLetterSequence(maxLetter);
      const nextRowFirstCell = `${nextRowLetter}1`;
      const isNextRowSelected = (activeTargetCell === nextRowFirstCell);

      html += `
        <div class="flex items-center gap-1.5 pt-1 border-t border-slate-800">
          <div class="w-6 font-bold text-xs text-slate-600 shrink-0 text-center">${nextRowLetter}</div>
          <button type="button" onclick="selectTargetCell('${nextRowFirstCell}')" 
            class="shrink-0 flex flex-col items-center justify-center w-16 h-14 rounded-lg border border-dashed transition-all ${
              isNextRowSelected 
                ? 'bg-blue-600/20 border-blue-400 ring-2 ring-blue-400 text-blue-300' 
                : 'border-slate-800 hover:border-slate-600 text-slate-600 hover:text-slate-400'
            }">
            <span class="text-[10px] font-bold">${nextRowFirstCell}</span>
            <span class="text-[10px] font-semibold">+ Row</span>
          </button>
        </div>`;

      container.innerHTML = html;
    }

    // Auto-increment column number (A1 -> A2 -> A3)
    function getNextGridColumn(currentCell) {
      const match = currentCell.match(/^([A-Z]+)(\d+)$/);
      if (!match) return currentCell;
      const letter = match[1];
      const number = parseInt(match[2], 10);
      return `${letter}${number + 1}`;
    }

    // Advance to next row letter (A4 -> B1, B8 -> C1, Z5 -> AA1)
    function advanceToNextRow() {
      const targetInput = document.getElementById('target-cell');
      const match = targetInput.value.trim().toUpperCase().match(/^([A-Z]+)(\d+)$/);
      
      if (!match) {
        targetInput.value = 'A1';
      } else {
        const letter = match[1];
        targetInput.value = `${getNextLetterSequence(letter)}1`;
      }
      
      updateMappedGridUI();
      if (scanInputMethod === 'HARDWARE') {
        focusHardwareScannerInput();
      }
    }

    // Increment letter logic (A -> B, Z -> AA, AA -> AB)
    function getNextLetterSequence(str) {
      let i = str.length - 1;
      let chars = str.split('');

      while (i >= 0) {
        if (chars[i] === 'Z') {
          chars[i] = 'A';
          i--;
        } else {
          chars[i] = String.fromCharCode(chars[i].charCodeAt(0) + 1);
          return chars.join('');
        }
      }
      return 'A' + chars.join('');
    }
  </script>
</body>
</html>
